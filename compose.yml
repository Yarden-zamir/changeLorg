services:
  app:
    build: .
    # One process owns DuckDB. Revisit storage before any replica or worker increase.
    scale: 1
    environment:
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
      KITSHN_DATA_DIR: ${KITSHN_DATA_DIR}
      KITSHN_LOG_DIR: ${KITSHN_LOG_DIR}
      KITSHN_SOCKET_DIR: ${KITSHN_SOCKET_DIR}
      KITSHN_DEFAULT_SOCKET: ${KITSHN_DEFAULT_SOCKET}
      RIFFLE_DATA_DIR: /data
      RIFFLE_DB: /data/riffle.duckdb
      RIFFLE_AUTH_ENABLED: ${RIFFLE_AUTH_ENABLED:-false}
      RIFFLE_OAUTH2_PROXY_URL: http://oauth2-proxy:4180
      RIFFLE_PUBLIC_ORIGIN: ${RIFFLE_PUBLIC_ORIGIN:-}
      # The news site reads and changes the state of signed-in readers from the browser.
      RIFFLE_CORS_ORIGINS: ${RIFFLE_CORS_ORIGINS:-https://news.yarden-zamir.com,https://the-riffle.yarden-zamir.com}
      RIFFLE_AUTO_REFRESH: "true"
      RIFFLE_REFRESH_INTERVAL_SECONDS: "3600"
      RIFFLE_REFRESH_WINDOW: "30d"
      RIFFLE_SEED_DEFAULT_SOURCES: "true"
    volumes:
      - ${KITSHN_DATA_DIR}/data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 5

  oauth2-proxy:
    profiles: [github-auth]
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4
    command:
      - --http-address=0.0.0.0:4180
      - --provider=github
      - --proxy-prefix=/auth
      - --redirect-url=${RIFFLE_PUBLIC_ORIGIN:-https://riffle.yarden-zamir.com}/auth/callback
      # Sign-in and sign-out may return to the news site, which links to /auth/start?rd=<its page>.
      - --whitelist-domain=news.yarden-zamir.com
      - --whitelist-domain=the-riffle.yarden-zamir.com
      - --reverse-proxy=true
      - --email-domain=*
      - --set-xauthrequest=true
      - --pass-access-token=true
      - --skip-provider-button=true
      - --cookie-name=_riffle_oauth
      - --cookie-secure=true
      - --cookie-httponly=true
      - --cookie-samesite=lax
      - --cookie-path=/
      - --cookie-expire=720h
      - --cookie-refresh=0
      - --upstream=static://202
    environment:
      # Compose interpolates disabled profiles too. oauth2-proxy rejects empty credentials at startup.
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      KITSHN_RECIPE: ${KITSHN_RECIPE}
      KITSHN_ENVIRONMENT: ${KITSHN_ENVIRONMENT}
      KITSHN_DEPLOYMENT: ${KITSHN_DEPLOYMENT}
    expose:
      - "4180"
    # The distroless image has no probe tools. The auth socket proxy checks its HTTP endpoint instead.
    restart: unless-stopped

  auth-socket-proxy:
    profiles: [github-auth]
    image: alpine/socat:latest
    pull_policy: always
    command: ["UNIX-LISTEN:${KITSHN_SOCKET_DIR}/auth.sock,fork,unlink-early,mode=666", "TCP:oauth2-proxy:4180"]
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    depends_on:
      oauth2-proxy:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "test -S '${KITSHN_SOCKET_DIR}/auth.sock' && wget -q -O /dev/null http://oauth2-proxy:4180/ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  socket-proxy:
    image: alpine/socat:latest
    pull_policy: always
    command: ["UNIX-LISTEN:${KITSHN_DEFAULT_SOCKET},fork,unlink-early,mode=666", "TCP:app:8000"]
    volumes:
      - ${KITSHN_SOCKET_DIR}:${KITSHN_SOCKET_DIR}
    networks:
      - default
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "test", "-S", "${KITSHN_DEFAULT_SOCKET}"]
      interval: 10s
      timeout: 5s
      retries: 5
